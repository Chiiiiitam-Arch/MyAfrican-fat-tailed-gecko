<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ニシアフ飼育ノート</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0a0a0c;
  --card:#161619;
  --card-2:#1c1c21;
  --input:#202024;
  --border:#333136;
  --border-strong:#48464b;
  --text:#f3f1ed;
  --muted:#b5b0ba;
  --gold:#e8bc77;
  --gold-dim:#30271d;
  --gold-text:#19130c;
  --ok:#6ed49b;
  --ok-bg:#142b1f;
  --warn:#f5b963;
  --warn-bg:#332411;
  --danger:#ff8f89;
  --danger-bg:#36191a;
  --info:#8cc8ff;
  --info-bg:#162536;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;min-height:100dvh;overflow-x:hidden}
header{background:#111114;border-bottom:1px solid var(--border);padding:16px 16px 14px;position:sticky;top:0;z-index:30}
.header-inner{max-width:960px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
header small{display:block;color:var(--gold);letter-spacing:.16em;font-size:10px;font-weight:700}
h1{font-size:clamp(20px,4.8vw,28px);margin:2px 0 0;line-height:1.2}
h2{font-size:19px;margin:0 0 12px;line-height:1.3}
h3{font-size:15px;margin:0 0 8px;line-height:1.35}
p{margin:0 0 10px}
.save-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid var(--border);background:var(--card-2);white-space:nowrap}
.save-badge .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.save-badge.ok{background:var(--ok-bg);border-color:#26573d;color:var(--ok)}
.save-badge.ok .dot{background:var(--ok)}
.save-badge.cloud{background:var(--info-bg);border-color:#274a6e;color:var(--info)}
.save-badge.cloud .dot{background:var(--info)}
.save-badge.warn{background:var(--warn-bg);border-color:#69491b;color:var(--warn)}
.save-badge.warn .dot{background:var(--warn)}
.save-badge.test{background:#2d1a38;border-color:#673882;color:#dfb5ff}
.save-badge.test .dot{background:#dfb5ff}

.test-banner{background:#2d1a38;color:#f0d9ff;border-bottom:1px solid #673882;padding:8px 16px;font-size:13px;font-weight:600;text-align:center}
.test-banner.hidden{display:none}

nav{max-width:960px;margin:0 auto;padding:10px 12px 6px;display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;min-height:44px;padding:8px 14px;border-radius:12px;font-size:14px}

main{max-width:960px;margin:0 auto;padding:10px 12px 84px}
#status-bar{max-width:960px;margin:4px auto 0;padding:0 12px}
.status-msg{padding:10px 14px;border-radius:12px;font-size:13px;margin-bottom:6px;border:1px solid var(--border);background:var(--card-2);display:none}
.status-msg.show{display:block}
.status-msg.ok{background:var(--ok-bg);border-color:#26573d;color:var(--ok)}
.status-msg.warn{background:var(--warn-bg);border-color:#69491b;color:var(--warn)}
.status-msg.danger{background:var(--danger-bg);border-color:#6b2c2e;color:var(--danger)}

button,input,select,textarea{
  font:inherit;
  border:1px solid var(--border-strong);
  border-radius:12px;
  padding:10px 12px;
  background:var(--input);
  color:var(--text);
  min-height:44px;
  max-width:100%;
}
input,select,textarea{width:100%}
textarea{min-height:76px;resize:vertical}
button{cursor:pointer;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:border-color .15s,background .15s,transform .08s}
button:active{transform:scale(.98)}
button:hover{border-color:var(--gold)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.active,button.primary{background:var(--gold);color:var(--gold-text);border-color:var(--gold)}
button.secondary{background:var(--card-2);color:var(--text);border-color:var(--border-strong)}
button.danger-btn{background:var(--danger-bg);color:var(--danger);border-color:#6b2c2e}
button.small{min-height:38px;padding:6px 11px;font-size:13px;border-radius:10px}
input::placeholder,textarea::placeholder{color:#8e8994}

.card,section.box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:10px}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.nowrap{flex-wrap:nowrap}
label.field{display:grid;gap:4px;margin:8px 0;font-size:13px;color:var(--muted);font-weight:600}
label.field > span.hint{font-size:11px;font-weight:400;color:#938d9a}

.tag{display:inline-flex;align-items:center;gap:4px;background:var(--gold-dim);color:#f3cf94;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700}
.tag.muted-tag{background:#26262c;color:var(--muted)}
.tag.warn-tag{background:var(--warn-bg);color:var(--warn);border:1px solid #69491b}
.tag.ok-tag{background:var(--ok-bg);color:var(--ok)}
.tag.danger-tag{background:var(--danger-bg);color:var(--danger)}
.muted{color:var(--muted);font-size:13px}
.mini{font-size:12px;color:var(--muted)}

.pet-card{width:100%;text-align:left;display:block;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;color:var(--text);font-weight:400}
.pet-card:hover{border-color:var(--gold)}
.pet-card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.pet-name{font-size:19px;font-weight:800;display:flex;align-items:center;gap:6px}
.pet-order{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:8px;background:var(--gold-dim);color:var(--gold);font-size:12px;font-weight:800}

.food-item-row{background:var(--card-2);border:1px solid var(--border);border-radius:12px;padding:10px;margin-bottom:8px}
.food-item-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:12px;color:var(--gold);font-weight:700}
.custom-food-input{margin-top:6px}

.unconfirmed-box{background:var(--warn-bg);border:1px solid #69491b;border-radius:12px;padding:12px;margin-top:10px}
.unconfirmed-box h4{margin:0 0 6px;font-size:13px;color:var(--warn)}

.chart-wrap{width:100%;overflow:hidden}
canvas.weight-canvas{width:100%;height:210px;display:block}
details summary{cursor:pointer;padding:8px 4px;font-size:13px;color:var(--gold);font-weight:700}

.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:60;display:none;align-items:flex-end;justify-content:center;padding:0}
.modal-backdrop.open{display:flex}
@media(min-width:600px){.modal-backdrop{align-items:center;padding:16px}}
.modal-box{background:var(--card);border:1px solid var(--border-strong);border-radius:20px 20px 0 0;width:100%;max-width:580px;max-height:92dvh;display:flex;flex-direction:column;overflow:hidden}
@media(min-width:600px){.modal-box{border-radius:20px}}
.modal-head{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;background:#111114}
.modal-body{padding:16px;overflow-y:auto;flex:1}
.modal-foot{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;background:#111114}

.divider{height:1px;background:var(--border);margin:14px 0}
.date-heading{font-size:13px;font-weight:800;color:var(--gold);margin:14px 0 6px;padding-left:4px;display:flex;align-items:center;justify-content:space-between}
.error-list{background:var(--danger-bg);border:1px solid #6b2c2e;color:var(--danger);border-radius:12px;padding:12px;margin:10px 0;font-size:13px}
.error-list ul{margin:4px 0 0;padding-left:18px}
.preview-box{background:var(--card-2);border:1px solid var(--gold);border-radius:14px;padding:14px;margin-top:12px}
.sticky-save-bar{position:sticky;bottom:10px;z-index:20;background:rgba(16,16,20,.95);backdrop-filter:blur(8px);border:1px solid var(--gold);border-radius:16px;padding:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:12px}
</style>
</head>
<body>

<div id="test-banner" class="test-banner hidden">
  テストモード稼働中（独立した保存領域を使用中・本番データには影響しません）
</div>

<header>
  <div class="header-inner">
    <div>
      <small>AFRICAN FAT-TAILED GECKOS</small>
      <h1>ニシアフ飼育ノート</h1>
    </div>
    <div id="save-badge" class="save-badge" role="status" aria-live="polite">
      <span class="dot"></span><span id="save-badge-text">読み込み中...</span>
    </div>
  </div>
</header>

<nav id="nav" aria-label="メインメニュー"></nav>
<div id="status-bar"><div id="status-msg" class="status-msg" role="status" aria-live="polite"></div></div>
<main id="app"></main>

<!-- 汎用モーダル -->
<div id="modal-backdrop" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal-box">
    <div class="modal-head">
      <h2 id="modal-title" style="margin:0;font-size:17px">編集</h2>
      <button type="button" class="small secondary" id="modal-close">閉じる</button>
    </div>
    <div id="modal-body" class="modal-body"></div>
    <div id="modal-foot" class="modal-foot"></div>
  </div>
</div>

<!-- 確認ダイアログ（confirm代替） -->
<div id="confirm-backdrop" class="modal-backdrop" role="alertdialog" aria-modal="true">
  <div class="modal-box" style="max-width:420px">
    <div class="modal-head">
      <h2 id="confirm-title" style="margin:0;font-size:16px">確認</h2>
    </div>
    <div id="confirm-body" class="modal-body" style="font-size:14px"></div>
    <div class="modal-foot">
      <button type="button" class="secondary" id="confirm-cancel">キャンセル</button>
      <button type="button" class="primary" id="confirm-ok">実行する</button>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';

// ============================================================================
// 1. 定数・初期データ（9匹・27件を完全保全）
// ============================================================================
const STORAGE_KEY_PROD = 'nishiaf-care-journal-v1';
const STORAGE_KEY_TEST = 'nishiaf-care-journal-test';
const FB_CONFIG_KEY = 'nishiaf-firebase-config-v1';
const DRAFT_KEY = 'nishiaf-feed-draft-v1';
const RECOVERY_ID = 'feeding-2026-11-15';

const KINDS = { feed: '給餌', weight: '体重', health: '健康', breed: '繁殖' };
const SUPPLEMENTS = ['① 何もなし', '② カルシウム', '③ カルシウム＋D3', '④ RVM'];
const FOOD_CANDIDATES = [
  '冷凍フタホシ', '活フタホシ', '冷凍イエコ', '活イエコ',
  '冷凍クロコ', 'デュビア', 'ジャイアントミルワーム'
];
const FOOD_OTHER_VALUE = '__OTHER__';
const HEALTH_CATEGORIES = ['脱皮', '便', '食欲・体調', 'その他'];

const INITIAL_PETS = [
  { id: '0', name: 'おる', sex: '♀', morph: 'WO Zero het Ghost Oreo', acquired: '2026-01-11', hatched: '', source: 'RAF', mother: '', father: '', note: '' },
  { id: '1', name: 'める', sex: '♀', morph: 'WO het Ghost Amel Patternless', acquired: '2026-01-11', hatched: '', source: 'RAF', mother: '', father: '', note: '' },
  { id: '2', name: 'ろき', sex: '♂', morph: 'Zero 66% het Caramel（CK LINE）', acquired: '2026-02-07', hatched: '', source: 'DREXX', mother: '', father: '', note: '' },
  { id: '3', name: 'そる', sex: '♂', morph: 'Snow Zulu het Amel', acquired: '2026-02-07', hatched: '', source: 'Noir', mother: '', father: '', note: '' },
  { id: '4', name: 'ぷな', sex: '♀', morph: 'Caramel het Amel', acquired: '2026-02-07', hatched: '', source: 'Noir', mother: '', father: '', note: '' },
  { id: '5', name: 'ぱる', sex: '♂', morph: 'Ghost Oreo', acquired: '2026-03-01', hatched: '', source: 'RAF', mother: '', father: '', note: '' },
  { id: '6', name: 'もる', sex: '♀', morph: 'Super Zero Ghost', acquired: '2026-05-24', hatched: '', source: 'RAF', mother: '', father: '', note: '' },
  { id: '7', name: 'あま', sex: '♂', morph: 'Purple Haze', acquired: '2026-05-24', hatched: '', source: 'ファットテール', mother: '', father: '', note: '' },
  {
    id: '8', name: 'ちび', sex: '未判別', morph: '', acquired: '', hatched: '2026-06-06〜2026-06-07',
    source: '', mother: '1', father: '2',
    note: '2026/06/06〜07に孵化。過去体重 3.6 g、6.1 g（測定日未確認）。'
  }
];

const INITIAL_WEIGHTS = [
  { id: 'seed-1', kind: 'weight', date: '2026-08-02', pet: '0', value: '60.9', note: '' },
  { id: 'seed-2', kind: 'weight', date: '2026-08-02', pet: '1', value: '64.4', note: '' },
  { id: 'seed-3', kind: 'weight', date: '2026-08-02', pet: '2', value: '63.7', note: '' },
  { id: 'seed-4', kind: 'weight', date: '2026-08-02', pet: '3', value: '47.9', note: '' },
  { id: 'seed-5', kind: 'weight', date: '2026-08-02', pet: '4', value: '41.5', note: '' },
  { id: 'seed-6', kind: 'weight', date: '2026-08-02', pet: '5', value: '51.5', note: '' },
  { id: 'seed-7', kind: 'weight', date: '2026-08-02', pet: '6', value: '15.4', note: '' },
  { id: 'seed-8', kind: 'weight', date: '2026-08-02', pet: '7', value: '18.0', note: '' },
  {
    id: 'seed-9', kind: 'weight', date: '2026-08-02', pet: '8', value: '18.0',
    unconfirmed: true,
    unconfirmedReason: '過去引き継ぎ情報に同日6.1gの記載あり（3.6g・6.1gは測定日未確認）。確認できるまで確定グラフから除外。',
    note: ''
  }
];

const INITIAL_PAST_FEEDS = [
  { id: 'seed-10', kind: 'feed', date: '2026-06-14', pet: '8', food: '冷凍フタホシ', count: '', supp: '', result: '', note: '置き餌で摂餌開始' },
  { id: 'seed-11', kind: 'feed', date: '2026-06-18', pet: '8', food: 'デュビア', count: '', supp: '', result: '', note: '極小を摂餌' },
  { id: 'seed-12', kind: 'feed', date: '2026-07-03', pet: '8', food: '', count: '2', supp: '④ RVM', result: '', note: 'RVM粉、2個完食。餌の種類は未確認。' }
];

const INITIAL_BREEDS = [
  { id: 'seed-13', kind: 'breed', date: '2026-03-02', pet: '1', partner: '', child: '', note: '1st 産卵（2卵）' },
  { id: 'seed-14', kind: 'breed', date: '2026-03-18', pet: '1', partner: '', child: '', note: '2nd 産卵（2卵）' },
  { id: 'seed-15', kind: 'breed', date: '2026-04-03', pet: '1', partner: '', child: '', note: '3rd 産卵（1卵）' },
  {
    id: 'seed-16', kind: 'breed', date: '2026-05-14', pet: '1', partner: '', child: '',
    unconfirmed: true,
    unconfirmedReason: '第1クラッチか第2クラッチかに過去記録との食い違いあり',
    note: '2nd 孵化。アシスト後死亡'
  },
  { id: 'seed-17', kind: 'breed', date: '2026-05-15', pet: '1', partner: '', child: '', note: '1st 孵化。記録時点で生存' },
  { id: 'seed-18', kind: 'breed', date: '2026-06-06', pet: '1', partner: '2', child: '8', note: '3rd 孵化。孵化日は6/6〜7の範囲。' }
];

const RECOVERED_FEEDS = ['1', '3', '', '3', '3', '3', '4', '4', '4'].map((count, i) => ({
  id: `${RECOVERY_ID}-${i}`,
  kind: 'feed',
  date: '2026-11-15',
  pet: String(i),
  food: '冷凍フタホシ',
  count,
  supp: '③ カルシウム＋D3',
  result: i === 2 ? '食べなかった' : '食べた',
  note: ''
}));

function buildInitialData() {
  return {
    pets: structuredClone(INITIAL_PETS),
    records: [
      ...structuredClone(INITIAL_WEIGHTS),
      ...structuredClone(INITIAL_PAST_FEEDS),
      ...structuredClone(INITIAL_BREEDS),
      ...structuredClone(RECOVERED_FEEDS)
    ],
    recoveredFeeding: RECOVERY_ID,
    updatedAt: Date.now()
  };
}

/** 既存データ（旧バージョンJSON等）を安全に正規化しつつ、復元9件の重複・復活を防ぐ */
function normalizeAndMerge(raw) {
  if (!raw || !Array.isArray(raw.pets) || !Array.isArray(raw.records)) {
    return buildInitialData();
  }
  const pets = raw.pets.map((p, idx) => {
    const def = INITIAL_PETS.find(d => d.id === String(p.id)) || INITIAL_PETS[idx] || {};
    return {
      id: String(p.id ?? idx),
      name: p.name ?? def.name ?? '',
      sex: p.sex ?? def.sex ?? '未判別',
      morph: p.morph ?? def.morph ?? '',
      acquired: p.acquired ?? def.acquired ?? '',
      hatched: p.hatched !== undefined ? p.hatched : (def.hatched ?? ''),
      source: p.source ?? def.source ?? '',
      mother: p.mother !== undefined ? p.mother : (def.mother ?? ''),
      father: p.father !== undefined ? p.father : (def.father ?? ''),
      note: p.note ?? def.note ?? ''
    };
  });

  const records = raw.records.map(r => {
    const copy = { ...r };
    if (copy.id === 'seed-9' && !copy.confirmedByUser && copy.unconfirmed === undefined) {
      copy.unconfirmed = true;
      copy.unconfirmedReason = INITIAL_WEIGHTS[8].unconfirmedReason;
    }
    if (copy.id === 'seed-16' && !copy.confirmedByUser && copy.unconfirmed === undefined) {
      copy.unconfirmed = true;
      copy.unconfirmedReason = INITIAL_BREEDS[3].unconfirmedReason;
    }
    return copy;
  });

  let recoveredFeeding = raw.recoveredFeeding || '';
  if (recoveredFeeding !== RECOVERY_ID) {
    const fields = ['kind', 'date', 'pet', 'food', 'count', 'supp', 'result', 'note'];
    const additions = RECOVERED_FEEDS.filter(rec =>
      !records.some(ex => ex.id === rec.id || fields.every(f => String(ex[f] ?? '') === String(rec[f] ?? '')))
    );
    records.push(...additions);
    recoveredFeeding = RECOVERY_ID;
  }

  return {
    pets,
    records,
    recoveredFeeding,
    updatedAt: raw.updatedAt || Date.now()
  };
}

// ============================================================================
// 2. 日付・ユーティリティ（日本時間 Asia/Tokyo 基準）
// ============================================================================
function todayJST() {
  return new Intl.DateTimeFormat('sv-SE', { timeZone: 'Asia/Tokyo' }).format(new Date());
}
function diffDaysJST(fromDateStr, toDateStr = todayJST()) {
  if (!fromDateStr || !toDateStr) return null;
  const t1 = Date.parse(fromDateStr + 'T00:00:00+09:00');
  const t2 = Date.parse(toDateStr + 'T00:00:00+09:00');
  if (Number.isNaN(t1) || Number.isNaN(t2)) return null;
  return Math.round((t2 - t1) / 86400000);
}
function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function uid() {
  return globalThis.crypto?.randomUUID?.() || ('rec-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8));
}
function sortRecordsDesc(list) {
  return list.slice().sort((a, b) => {
    const d = String(b.date || '').localeCompare(String(a.date || ''));
    if (d !== 0) return d;
    return String(b.id || '').localeCompare(String(a.id || ''));
  });
}

/** 餌の種類プルダウンの選択肢HTMLを生成 */
function foodSelectOptionsHtml(foodVal, isCustom) {
  const val = String(foodVal ?? '');
  const useOther = Boolean(isCustom) || (val !== '' && !FOOD_CANDIDATES.includes(val));
  const selectedKey = useOther ? FOOD_OTHER_VALUE : val;
  let html = `<option value="" ${selectedKey === '' ? 'selected' : ''}>未選択・未判別</option>`;
  for (const cand of FOOD_CANDIDATES) {
    html += `<option value="${esc(cand)}" ${selectedKey === cand ? 'selected' : ''}>${esc(cand)}</option>`;
  }
  html += `<option value="${FOOD_OTHER_VALUE}" ${selectedKey === FOOD_OTHER_VALUE ? 'selected' : ''}>その他（自由入力）</option>`;
  return { html, useOther };
}

// ============================================================================
// 3. アプリ状態 & ストレージ管理
// ============================================================================
const state = {
  testMode: false,
  storageOk: true,
  cloudStatus: 'off', // 'off' | 'connecting' | 'synced' | 'error'
  cloudUser: null,
  autoSync: true,
  data: buildInitialData(),
  tab: '個体',
  selectedPetId: '',
  // フィルター
  petQuery: '',
  petSexFilter: '',
  recPetFilter: '',
  recKindFilter: '',
  recDateFilter: '',
  // 給餌入力ドラフト（タブ移動しても保持）
  feedDate: todayJST(),
  feedDraft: {}, // { [petId]: { items: [{food,count,supp,customFood}], result, note } }
  feedErrors: [],
  feedDupWarning: false,
  // JSON復元プレビュー
  restorePreview: null,
};

function currentStorageKey() {
  return state.testMode ? STORAGE_KEY_TEST : STORAGE_KEY_PROD;
}

function loadFromLocalStorage() {
  const key = currentStorageKey();
  try {
    const raw = localStorage.getItem(key);
    if (raw) {
      state.data = normalizeAndMerge(JSON.parse(raw));
    } else {
      state.data = buildInitialData();
    }
    localStorage.setItem(key, JSON.stringify(state.data));
    state.storageOk = true;
  } catch (e) {
    state.storageOk = false;
    state.data = buildInitialData();
  }
  updateSaveBadge();
}

function persistData(nextData, successMsg) {
  nextData.updatedAt = Date.now();
  state.data = nextData;
  const key = currentStorageKey();
  try {
    localStorage.setItem(key, JSON.stringify(state.data));
    state.storageOk = true;
  } catch (e) {
    state.storageOk = false;
  }
  updateSaveBadge();

  if (state.storageOk) {
    showStatus(successMsg + (state.testMode ? '（テスト領域に保存）' : '（ブラウザに保存済み）'), 'ok');
  } else {
    showStatus('画面に一時反映しました（この環境ではブラウザ保存不可。閉じる前にJSON書き出しを行ってください）', 'warn');
  }

  if (!state.testMode && state.autoSync && state.cloudUser && fbClient.db) {
    pushToCloud(true);
  }
  return true;
}

function loadDraft() {
  try {
    const raw = sessionStorage.getItem(DRAFT_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed.feedDate) state.feedDate = parsed.feedDate;
      if (parsed.feedDraft) state.feedDraft = parsed.feedDraft;
    }
  } catch {}
}
function saveDraft() {
  try {
    sessionStorage.setItem(DRAFT_KEY, JSON.stringify({
      feedDate: state.feedDate,
      feedDraft: state.feedDraft
    }));
  } catch {}
}
function ensureDraftForPet(petId) {
  if (!state.feedDraft[petId]) {
    state.feedDraft[petId] = { items: [{ food: '', count: '', supp: '', customFood: false }], result: '', note: '' };
  }
  if (!Array.isArray(state.feedDraft[petId].items) || !state.feedDraft[petId].items.length) {
    state.feedDraft[petId].items = [{ food: '', count: '', supp: '', customFood: false }];
  }
  return state.feedDraft[petId];
}

function updateSaveBadge() {
  const badge = document.getElementById('save-badge');
  const txt = document.getElementById('save-badge-text');
  const banner = document.getElementById('test-banner');
  banner.classList.toggle('hidden', !state.testMode);

  badge.className = 'save-badge';
  if (state.testMode) {
    badge.classList.add('test');
    txt.textContent = state.storageOk ? 'テスト保存モード' : 'テスト（一時反映のみ）';
    return;
  }
  if (state.cloudStatus === 'synced' && state.cloudUser) {
    badge.classList.add('cloud');
    txt.textContent = 'クラウド同期済み';
  } else if (state.cloudStatus === 'connecting') {
    badge.classList.add('warn');
    txt.textContent = 'クラウド接続中...';
  } else if (state.storageOk) {
    badge.classList.add('ok');
    txt.textContent = 'ローカル保存済み';
  } else {
    badge.classList.add('warn');
    txt.textContent = '一時反映のみ（保存不可）';
  }
}

let statusTimer = null;
function showStatus(msg, type = 'ok') {
  const el = document.getElementById('status-msg');
  el.textContent = msg;
  el.className = `status-msg show ${type}`;
  clearTimeout(statusTimer);
  statusTimer = setTimeout(() => { el.classList.remove('show'); }, 6000);
}

// ============================================================================
// 4. Firebase クラウド同期モジュール（既存コレクション構造と完全互換）
// ============================================================================
const fbClient = {
  app: null, auth: null, db: null,
  mods: null,
  config: null
};

function loadSavedFbConfig() {
  try {
    const raw = localStorage.getItem(FB_CONFIG_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      fbClient.config = parsed.config || null;
      state.autoSync = parsed.autoSync !== false;
    }
  } catch {}
}

async function initFirebaseIfConfigured(silent = true) {
  if (!fbClient.config || !fbClient.config.apiKey || !fbClient.config.projectId) return false;
  try {
    state.cloudStatus = 'connecting';
    updateSaveBadge();
    if (!fbClient.mods) {
      const [appMod, authMod, fsMod] = await Promise.all([
        import('https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js'),
        import('https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js'),
        import('https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js')
      ]);
      fbClient.mods = { appMod, authMod, fsMod };
    }
    const { appMod, authMod, fsMod } = fbClient.mods;
    const existing = appMod.getApps().find(a => a.name === 'nishiaf-cloud');
    fbClient.app = existing || appMod.initializeApp(fbClient.config, 'nishiaf-cloud');
    fbClient.auth = authMod.getAuth(fbClient.app);
    fbClient.db = fsMod.getFirestore(fbClient.app);

    authMod.onAuthStateChanged(fbClient.auth, async (user) => {
      state.cloudUser = user || null;
      if (user) {
        state.cloudStatus = 'synced';
        updateSaveBadge();
        if (!state.testMode) await pullFromCloud(true);
      } else {
        state.cloudStatus = 'off';
        updateSaveBadge();
      }
      if (state.tab === 'バックアップ・同期') render();
    });
    return true;
  } catch (err) {
    state.cloudStatus = 'error';
    updateSaveBadge();
    if (!silent) showStatus('Firebase初期化エラー: ' + (err.message || err), 'danger');
    return false;
  }
}

async function cloudLoginGoogle() {
  if (!fbClient.auth) {
    const ok = await initFirebaseIfConfigured(false);
    if (!ok) return;
  }
  try {
    const { GoogleAuthProvider, signInWithPopup } = fbClient.mods.authMod;
    await signInWithPopup(fbClient.auth, new GoogleAuthProvider());
    showStatus('Googleアカウントでログインしました。', 'ok');
  } catch (err) {
    showStatus('Googleログイン失敗: ' + (err.message || err), 'danger');
  }
}

async function cloudLoginAnon() {
  if (!fbClient.auth) {
    const ok = await initFirebaseIfConfigured(false);
    if (!ok) return;
  }
  try {
    await fbClient.mods.authMod.signInAnonymously(fbClient.auth);
    showStatus('匿名アカウントでクラウド接続しました。', 'ok');
  } catch (err) {
    showStatus('匿名ログイン失敗: ' + (err.message || err), 'danger');
  }
}

async function cloudLogout() {
  if (!fbClient.auth) return;
  await fbClient.mods.authMod.signOut(fbClient.auth);
  state.cloudUser = null;
  state.cloudStatus = 'off';
  updateSaveBadge();
  showStatus('クラウドからログアウトしました。', 'ok');
  render();
}

async function pushToCloud(silent = false) {
  if (!fbClient.db || !state.cloudUser) return;
  if (state.testMode) {
    if (!silent) showStatus('テストモード中はクラウドへ送信しません。', 'warn');
    return;
  }
  try {
    const { doc, setDoc } = fbClient.mods.fsMod;
    const ref = doc(fbClient.db, 'nishiaf_users', state.cloudUser.uid, 'data', 'main');
    await setDoc(ref, state.data);
    state.cloudStatus = 'synced';
    updateSaveBadge();
    if (!silent) showStatus('クラウドへ最新データを送信しました。', 'ok');
  } catch (err) {
    state.cloudStatus = 'error';
    updateSaveBadge();
    if (!silent) showStatus('クラウド送信エラー: ' + (err.message || err), 'danger');
  }
}

async function pullFromCloud(silent = false) {
  if (!fbClient.db || !state.cloudUser || state.testMode) return;
  try {
    const { doc, getDoc } = fbClient.mods.fsMod;
    const ref = doc(fbClient.db, 'nishiaf_users', state.cloudUser.uid, 'data', 'main');
    const snap = await getDoc(ref);
    if (snap.exists()) {
      const remote = normalizeAndMerge(snap.data());
      if (!silent || (remote.updatedAt || 0) > (state.data.updatedAt || 0)) {
        state.data = remote;
        try { localStorage.setItem(STORAGE_KEY_PROD, JSON.stringify(state.data)); } catch {}
        render();
        if (!silent) showStatus('クラウドから最新データを読み込みました。', 'ok');
      }
    } else if (!silent) {
      showStatus('クラウドにまだデータがありません。「クラウドへ送信」を実行してください。', 'warn');
    }
    state.cloudStatus = 'synced';
    updateSaveBadge();
  } catch (err) {
    state.cloudStatus = 'error';
    updateSaveBadge();
    if (!silent) showStatus('クラウド読込エラー: ' + (err.message || err), 'danger');
  }
}

// ============================================================================
// 5. データ集計・表示ヘルパー
// ============================================================================
function getPet(id) {
  return state.data.pets.find(p => p.id === String(id)) || null;
}
function petName(id) {
  return getPet(id)?.name || '未判別';
}

/** 給餌レコードの餌アイテム配列を統一取得（後方互換対応） */
function getFeedItems(r) {
  if (Array.isArray(r.items) && r.items.length > 0) {
    return r.items.map(it => ({ food: it.food ?? '', count: it.count ?? '', supp: it.supp ?? '' }));
  }
  return [{ food: r.food ?? '', count: r.count ?? '', supp: r.supp ?? '' }];
}

/** 確定済み最新体重 */
function latestConfirmedWeight(petId) {
  const today = todayJST();
  return sortRecordsDesc(
    state.data.records.filter(r => r.kind === 'weight' && r.pet === petId && !r.unconfirmed && r.date <= today)
  )[0] || null;
}

/** 最終摂餌日（result === '食べた' のみ） */
function latestEatenFeed(petId) {
  const today = todayJST();
  return sortRecordsDesc(
    state.data.records.filter(r => r.kind === 'feed' && r.pet === petId && r.result === '食べた' && r.date <= today)
  )[0] || null;
}

/** 最終給餌記録日（結果問わず） */
function latestAnyFeed(petId) {
  const today = todayJST();
  return sortRecordsDesc(
    state.data.records.filter(r => r.kind === 'feed' && r.pet === petId && r.date <= today)
  )[0] || null;
}

function formatFeedElapsed(petId) {
  const eaten = latestEatenFeed(petId);
  const anyFeed = latestAnyFeed(petId);
  const eatenDays = eaten ? diffDaysJST(eaten.date) : null;
  const mainText = eatenDays !== null ? `最終摂餌から${eatenDays}日（${eaten.date}）` : '最終摂餌日: 未確定';
  let subText = '';
  if (anyFeed && (!eaten || anyFeed.date !== eaten.date)) {
    const resLabel = anyFeed.result || '未判別';
    subText = `最終給餌記録: ${anyFeed.date}（${resLabel}）`;
  }
  return { mainText, subText, eaten, anyFeed };
}

function formatRecordSummary(r) {
  if (r.kind === 'feed') {
    const items = getFeedItems(r);
    const itemsText = items.map(it => {
      const f = it.food || '餌未判別';
      const c = (it.count !== '' && it.count != null) ? `${it.count}匹` : '数未入力';
      const s = it.supp || '添加未判別';
      return `${f} / ${c} / ${s}`;
    }).join(' ＋ ');
    const res = r.result || '結果未判別';
    return `${itemsText} 【${res}】`;
  }
  if (r.kind === 'weight') {
    return `${r.value} g` + (r.unconfirmed ? '（要確認）' : '');
  }
  if (r.kind === 'health') {
    return r.category || 'その他';
  }
  if (r.kind === 'breed') {
    return `母: ${petName(r.pet)} ／ 父: ${petName(r.partner)} ／ 子: ${r.child ? petName(r.child) : '未登録・未判別'}`;
  }
  return '';
}

function optionsHtml(list, selectedVal, emptyLabel) {
  let html = emptyLabel !== undefined ? `<option value="">${esc(emptyLabel)}</option>` : '';
  for (const item of list) {
    const [val, label] = Array.isArray(item) ? item : [item, item];
    html += `<option value="${esc(val)}" ${String(val) === String(selectedVal ?? '') ? 'selected' : ''}>${esc(label)}</option>`;
  }
  return html;
}
function petOptionsHtml(selectedVal, emptyLabel) {
  return optionsHtml(state.data.pets.map(p => [p.id, `${Number(p.id) + 1}. ${p.name}`]), selectedVal, emptyLabel);
}

  document.getElementById('confirm-title').textContent = title;
  document.getElementById('confirm-body').innerHTML = `<p style="margin:0;white-space:pre-wrap">${esc(message)}</p>`;
  const bd = document.getElementById('confirm-backdrop');

function render() {
  const nav = document.getElementById('nav');
  const tabs = ['個体', '給餌入力', '日付別記録', '繁殖', 'バックアップ・同期'];
  nav.innerHTML = tabs.map(t =>
    `<button type="button" class="${t === state.tab ? 'active' : 'secondary'}" data-nav="${esc(t)}">${esc(t)}</button>`
  ).join('');

  const app = document.getElementById('app');
  if (state.tab === '個体' && state.selectedPetId !== '') {
    renderPetDetail(app, state.selectedPetId);
  } else if (state.tab === '個体') {
    renderPetList(app);
  } else if (state.tab === '給餌入力') {
    renderBatchFeed(app);
  } else if (state.tab === '日付別記録') {
    renderRecordsByDate(app);
  } else if (state.tab === '繁殖') {
    renderBreeding(app);
  } else {
    renderBackupSync(app);
  }
}

function renderPetGrid() {
  const grid = document.getElementById('pet-grid');
  if (!grid) return;
  const q = state.petQuery.trim().toLowerCase();

    grid.innerHTML = `<div class="card"><p class="muted" style="margin:0">条件に一致する個体がいません。</p></div>`;

  grid.innerHTML = filtered.map((p) => {

function drawWeightChart(petId) {
  const root = document.getElementById('weight-chart-area');
  if (!root) return;
  const rs = sortRecordsDesc(state.data.records.filter(r => r.kind === 'weight' && r.pet === petId && !r.unconfirmed)).reverse();

    root.innerHTML = `<p class="muted" style="margin:0">確定済みの体重記録はまだありません。</p>`;
    return;
  }
  root.innerHTML = `
    <div class="chart-wrap"><canvas class="weight-canvas" role="img" aria-label="確定体重の推移グラフ"></canvas></div>
    <details>
      <summary>確定済みの測定値一覧（${rs.length}件）</summary>
      ${rs.map(r => `<div class="row spread" style="padding:4px 0;border-bottom:1px solid var(--border);font-size:13px"><span>${esc(r.date)}</span><strong>${esc(r.value)} g</strong></div>`).join('')}
    </details>
  `;
  const canvas = root.querySelector('canvas');
  requestAnimationFrame(() => {
    const w = canvas.clientWidth || 300, h = 210, dpr = window.devicePixelRatio || 1;
    canvas.width = w * dpr; canvas.height = h * dpr;
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.font = '12px system-ui';
    const vals = rs.map(r => Number(r.value));
    const times = rs.map(r => Date.parse(r.date + 'T00:00:00+09:00'));
    const low = Math.max(0, Math.min(...vals) - 3);
    const high = Math.max(...vals) + 3;
    const start = times[0], end = times[times.length - 1];
    const pts = vals.map((v, i) => [
      46 + (w - 64) * (start === end ? 0.5 : (times[i] - start) / (end - start)),
      170 - ((v - low) / (high - low || 1)) * 145
    ]);

    for (let i = 0; i <= 4; i++) {
      const y = 170 - i * 36.25;
      ctx.fillStyle = '#b5b0ba';
      ctx.fillText((low + (high - low) * i / 4).toFixed(1), 2, y + 4);
      ctx.strokeStyle = '#2d2b31';
      ctx.beginPath(); ctx.moveTo(46, y); ctx.lineTo(w - 14, y); ctx.stroke();
    }
    ctx.strokeStyle = '#e8bc77'; ctx.lineWidth = 2.5;
    ctx.beginPath();
    pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
    ctx.stroke();

    ctx.fillStyle = '#f3cf94';
    pts.forEach(([x, y]) => { ctx.beginPath(); ctx.arc(x, y, 4.5, 0, Math.PI * 2); ctx.fill(); });
    ctx.fillStyle = '#b5b0ba';
    ctx.fillText(rs[0].date, 46, 196);
    if (start !== end) ctx.fillText(rs[rs.length - 1].date, Math.max(120, w - 88), 196);
  });
}

function handleBatchSave(allowAdditional) {
  state.feedErrors = [];
  state.feedDupWarning = false;

  if (!/^\d{4}-\d{2}-\d{2}$/.test(state.feedDate)) {
    state.feedErrors.push('給餌日を正しく選択してください。');
  }

  const toSave = [];
  for (const p of state.data.pets) {
    const d = state.feedDraft[p.id];
    if (!d) continue;
    const validItems = (d.items || []).map(it => ({
      food: String(it.food ?? '').trim(),
      count: String(it.count ?? '').trim(),
      supp: String(it.supp ?? '').trim()
    })).filter(it => it.food || it.count !== '' || it.supp);

    const res = String(d.result ?? '').trim();
    const note = String(d.note ?? '').trim();

    if (!validItems.length && !res && !note) continue;

    for (const it of validItems) {
      if (it.count !== '' && !/^\d+$/.test(it.count)) {
        state.feedErrors.push(`${p.name}: 給餌数は0以上の整数か空欄にしてください（入力値: ${it.count}）`);
      }
    }

    const first = validItems[0] || { food: '', count: '', supp: '' };
    const rec = {
      id: uid(),
      kind: 'feed',
      date: state.feedDate,
      pet: p.id,
      food: first.food,
      count: first.count,
      supp: first.supp,
      result: res,
      note
    };
    if (validItems.length > 1) {
      rec.items = validItems;
    }
    toSave.push(rec);
  }

  if (state.feedErrors.length) {
    render();
    return;
  }
  if (!toSave.length) {
    state.feedErrors.push('少なくとも1匹分の餌・数・添加・摂餌結果・メモのいずれかを入力してください。');
    render();
    return;
  }

  const hasDup = toSave.some(r =>
    state.data.records.some(ex => ex.kind === 'feed' && ex.pet === r.pet && ex.date === r.date)
  );
  if (hasDup && !allowAdditional) {
    state.feedDupWarning = true;
    render();
    return;
  }

  const next = { ...state.data, records: [...state.data.records, ...toSave] };
  persistData(next, `${toSave.length}件の給餌記録を保存しました`);
  state.feedDraft = {};
  state.feedDupWarning = false;
  saveDraft();

  state.tab = '日付別記録';
  state.recDateFilter = state.feedDate;
  state.recKindFilter = 'feed';
  state.recPetFilter = '';
  render();
  window.scrollTo(0, 0);
}

      });
    });
    document.getElementById('btn-restore-cancel').addEventListener('click', () => {
      state.restorePreview = null;
      render();
    });
  }

  document.getElementById('btn-toggle-test').addEventListener('click', () => {
    state.testMode = !state.testMode;
    state.restorePreview = null;
    loadFromLocalStorage();
    showStatus(state.testMode ? 'テストモードに切り替えました（本番データは保護されます）' : '本番モードに戻りました', 'ok');
    render();
  });
  const resetTestBtn = document.getElementById('btn-reset-test');
  if (resetTestBtn) {
    resetTestBtn.addEventListener('click', () => {
      showConfirm('テスト領域の初期化', 'テスト領域のデータを初期27件の状態にリセットしますか？', () => {
        persistData(buildInitialData(), 'テスト領域を初期化しました');
        render();
      });
    });
  }

  document.getElementById('btn-save-fb-cfg').addEventListener('click', async () => {
    const newCfg = {
      apiKey: document.getElementById('fb-apiKey').value.trim(),
      authDomain: document.getElementById('fb-authDomain').value.trim(),
      projectId: document.getElementById('fb-projectId').value.trim(),
      appId: document.getElementById('fb-appId').value.trim()
    };
    state.autoSync = document.getElementById('fb-auto-sync').checked;
    fbClient.config = newCfg;
    try { localStorage.setItem(FB_CONFIG_KEY, JSON.stringify({ config: newCfg, autoSync: state.autoSync })); } catch {}
    const ok = await initFirebaseIfConfigured(false);
    if (ok) showStatus('Firebase設定を保存しました。ログインして同期を開始してください。', 'ok');
  });

  document.getElementById('fb-auto-sync').addEventListener('change', (e) => {
    state.autoSync = e.target.checked;
    try { localStorage.setItem(FB_CONFIG_KEY, JSON.stringify({ config: fbClient.config, autoSync: state.autoSync })); } catch {}
  });

  const gBtn = document.getElementById('btn-login-google');
  if (gBtn) gBtn.addEventListener('click', cloudLoginGoogle);
  const aBtn = document.getElementById('btn-login-anon');
  if (aBtn) aBtn.addEventListener('click', cloudLoginAnon);
  const pushBtn = document.getElementById('btn-cloud-push');
  if (pushBtn) pushBtn.addEventListener('click', () => pushToCloud(false));
  const pullBtn = document.getElementById('btn-cloud-pull');
  if (pullBtn) pullBtn.addEventListener('click', () => pullFromCloud(false));
  const outBtn = document.getElementById('btn-cloud-logout');
  if (outBtn) outBtn.addEventListener('click', cloudLogout);
}

// ============================================================================
// 8. プロフィール編集 & 記録追加/編集モーダル
// ============================================================================
function openProfileModal(petId) {
  const p = getPet(petId);
  if (!p) return;
  const body = `
    <form id="profile-form">
      <label class="field">名前（必須）<input name="name" type="text" value="${esc(p.name)}" required></label>
      <label class="field">性別<select name="sex">${optionsHtml(['♀', '♂', '未判別'], p.sex)}</select></label>
      <label class="field">モルフ<input name="morph" type="text" value="${esc(p.morph)}"></label>
      <div class="grid-2">
        <label class="field">お迎え日<input name="acquired" type="date" value="${esc(p.acquired)}"></label>
        <label class="field">孵化日（範囲表記可）<input name="hatched" type="text" value="${esc(p.hatched)}" placeholder="例: 2026-06-06〜2026-06-07"></label>
      </div>
      <label class="field">入手先<input name="source" type="text" value="${esc(p.source)}"></label>
      <div class="grid-2">
        <label class="field">母<select name="mother">${petOptionsHtml(p.mother, '未設定')}</select></label>
        <label class="field">父<select name="father">${petOptionsHtml(p.father, '未設定')}</select></label>
      </div>
      <label class="field">メモ<textarea name="note">${esc(p.note)}</textarea></label>
    </form>
  `;
  openModal(`${p.name} のプロフィール編集`, body, `
    <button type="button" class="secondary" onclick="document.getElementById('modal-close').click()">キャンセル</button>
    <button type="button" class="primary" id="save-profile-btn">保存</button>
  `);
  document.getElementById('save-profile-btn').addEventListener('click', () => {
    const fd = new FormData(document.getElementById('profile-form'));
    const name = String(fd.get('name') || '').trim();
    if (!name) { showStatus('名前を入力してください。', 'danger'); return; }
    const updated = {
      ...p,
      name,
      sex: String(fd.get('sex') || '未判別'),
      morph: String(fd.get('morph') || '').trim(),
      acquired: String(fd.get('acquired') || '').trim(),
      hatched: String(fd.get('hatched') || '').trim(),
      source: String(fd.get('source') || '').trim(),
      mother: String(fd.get('mother') || ''),
      father: String(fd.get('father') || ''),
      note: String(fd.get('note') || '').trim()
    };
    const next = { ...state.data, pets: state.data.pets.map(x => x.id === p.id ? updated : x) };
    persistData(next, 'プロフィールを保存しました');
    closeModal();
    render();
  });
}

function openRecordModal(record, isNew = false) {
  const k = record.kind;
  let modalFeedItems = k === 'feed'
    ? getFeedItems(record).map(it => ({
        ...it,
        customFood: Boolean(it.food && !FOOD_CANDIDATES.includes(it.food))
      }))
    : [];

  // モーダル内で日付・個体・結果・メモを再描画時に保持するための一時状態
  const modalState = {
    date: record.date || todayJST(),
    pet: record.pet ?? '',
    result: record.result ?? '',
    note: record.note ?? '',
    value: record.value ?? '',
    category: record.category || '脱皮',
    partner: record.partner ?? '',
    child: record.child ?? '',
    unconfirmed: Boolean(record.unconfirmed)
  };

  function captureFormInputs() {
    const form = document.getElementById('rec-form');
    if (!form) return;
    const fd = new FormData(form);
    if (fd.has('date')) modalState.date = String(fd.get('date') || '');
    if (fd.has('pet')) modalState.pet = String(fd.get('pet') || '');
    if (fd.has('result')) modalState.result = String(fd.get('result') || '');
    if (fd.has('note')) modalState.note = String(fd.get('note') || '');
    if (fd.has('value')) modalState.value = String(fd.get('value') || '');
    if (fd.has('category')) modalState.category = String(fd.get('category') || '');
    if (fd.has('partner')) modalState.partner = String(fd.get('partner') || '');
    if (fd.has('child')) modalState.child = String(fd.get('child') || '');
    const uncEl = form.querySelector('[name="unconfirmed"]');
    if (uncEl) modalState.unconfirmed = uncEl.checked;
  }

  function buildBody() {
    let specific = '';
    if (k === 'feed') {
      specific = `
        <div id="modal-feed-items">
          ${modalFeedItems.map((it, idx) => {
            const { html: foodOpts, useOther } = foodSelectOptionsHtml(it.food, it.customFood);
            return `
              <div class="food-item-row">
                <div class="food-item-head">
                  <span>餌 ${idx + 1}</span>
                  ${modalFeedItems.length > 1 ? `<button type="button" class="small danger-btn" data-m-rem="${idx}" style="min-height:28px;padding:2px 8px;font-size:12px">削除</button>` : ''}
                </div>
                <label class="field" style="margin:4px 0">
                  餌の種類
                  <select data-m-field="foodSelect" data-m-idx="${idx}">${foodOpts}</select>
                  ${useOther ? `<input type="text" class="custom-food-input" data-m-field="foodCustom" data-m-idx="${idx}" value="${esc(it.food)}" placeholder="餌の種類を自由入力">` : ''}
                </label>
                <div class="grid-2" style="gap:6px">
                  <label class="field" style="margin:4px 0">給餌数（空欄可）<input type="number" min="0" step="1" inputmode="numeric" data-m-field="count" data-m-idx="${idx}" value="${esc(it.count)}"></label>
                  <label class="field" style="margin:4px 0">添加<select data-m-field="supp" data-m-idx="${idx}">${optionsHtml(SUPPLEMENTS, it.supp, '未判別')}</select></label>
                </div>
              </div>
            `;
          }).join('')}
        </div>
        <button type="button" class="small secondary" id="modal-add-food" style="width:100%;margin-bottom:8px">＋ 餌の種類を追加</button>
        <label class="field">摂餌結果<select name="result">${optionsHtml(['食べた', '食べなかった'], modalState.result, '未判別')}</select></label>
      `;
    } else if (k === 'weight') {
      specific = `
        <label class="field">体重（g）<input name="value" type="number" min="0.01" step="0.01" value="${esc(modalState.value)}" required></label>
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;margin:8px 0;cursor:pointer">
          <input type="checkbox" name="unconfirmed" ${modalState.unconfirmed ? 'checked' : ''} style="width:auto;min-height:auto">
          要確認データとして扱う（確定グラフから除外）
        </label>
      `;
    } else if (k === 'health') {
      specific = `<label class="field">種類<select name="category">${optionsHtml(HEALTH_CATEGORIES, modalState.category)}</select></label>`;
    } else if (k === 'breed') {
      specific = `
        <div class="grid-2">
          <label class="field">父<select name="partner">${petOptionsHtml(modalState.partner, '未判別')}</select></label>
          <label class="field">子<select name="child">${petOptionsHtml(modalState.child, '未登録・未判別')}</select></label>
        </div>
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;margin:8px 0;cursor:pointer">
          <input type="checkbox" name="unconfirmed" ${modalState.unconfirmed ? 'checked' : ''} style="width:auto;min-height:auto">
          要確認フラグを付ける
        </label>
      `;
    }

    return `
      <form id="rec-form">
        <div class="grid-2">
          <label class="field">日付<input name="date" type="date" value="${esc(modalState.date)}" required></label>
          <label class="field">${k === 'breed' ? '母' : '個体'}<select name="pet">${petOptionsHtml(modalState.pet, k === 'breed' ? '未判別' : undefined)}</select></label>
        </div>
        ${specific}
        <label class="field">メモ<textarea name="note">${esc(modalState.note)}</textarea></label>
      </form>
    `;
  }

  function mountModal() {
    openModal(`${KINDS[k]}を${isNew ? '登録' : '編集'}`, buildBody(), `
      ${!isNew ? `<button type="button" class="danger-btn" id="del-rec-btn" style="margin-right:auto">削除</button>` : ''}
      <button type="button" class="secondary" onclick="document.getElementById('modal-close').click()">キャンセル</button>
      <button type="button" class="primary" id="save-rec-btn">保存</button>
    `);

    const bodyEl = document.getElementById('modal-body');
    if (k === 'feed') {
      bodyEl.oninput = (e) => {
        const idx = e.target.dataset?.mIdx;
        const field = e.target.dataset?.mField;
        if (idx === undefined || !field) return;
        const item = modalFeedItems[Number(idx)];
        if (field === 'foodCustom') item.food = e.target.value;
        else if (field === 'count') item.count = e.target.value;
      };
      bodyEl.onchange = (e) => {
        const idx = e.target.dataset?.mIdx;
        const field = e.target.dataset?.mField;
        if (idx === undefined || !field) return;
        const item = modalFeedItems[Number(idx)];
        if (field === 'foodSelect') {
          captureFormInputs();
          if (e.target.value === FOOD_OTHER_VALUE) {
            item.customFood = true;
            if (FOOD_CANDIDATES.includes(item.food)) item.food = '';
          } else {
            item.customFood = false;
            item.food = e.target.value;
          }
          mountModal();
        } else if (field === 'supp') {
          item.supp = e.target.value;
        }
      };
      const addBtn = document.getElementById('modal-add-food');
      if (addBtn) addBtn.onclick = () => {
        captureFormInputs();
        modalFeedItems.push({ food: '', count: '', supp: '', customFood: false });
        mountModal();
      };
      bodyEl.querySelectorAll('[data-m-rem]').forEach(b => {
        b.onclick = () => {
          captureFormInputs();
          modalFeedItems.splice(Number(b.dataset.mRem), 1);
          mountModal();
        };
      });
    } else {
      bodyEl.oninput = null;
      bodyEl.onchange = null;
    }

    const delBtn = document.getElementById('del-rec-btn');
    if (delBtn) {
      delBtn.onclick = () => {
        showConfirm('記録の削除', 'この記録を削除してもよろしいですか？', () => {
          const next = { ...state.data, records: state.data.records.filter(r => r.id !== record.id) };
          persistData(next, '記録を削除しました');
          closeModal();
          render();
        });
      };
    }

    document.getElementById('save-rec-btn').onclick = () => {
      captureFormInputs();
      const date = modalState.date.trim();
      const pet = modalState.pet;
      const note = modalState.note.trim();
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { showStatus('日付を正しく入力してください。', 'danger'); return; }

      const updated = { ...record, id: record.id || uid(), kind: k, date, pet, note };
      if (k === 'feed') {
        const cleaned = modalFeedItems.map(it => ({
          food: String(it.food ?? '').trim(),
          count: String(it.count ?? '').trim(),
          supp: String(it.supp ?? '').trim()
        }));
        for (const it of cleaned) {
          if (it.count !== '' && !/^\d+$/.test(it.count)) {
            showStatus('給餌数は0以上の整数か空欄にしてください。', 'danger');
            return;
          }
        }
        updated.food = cleaned[0]?.food || '';
        updated.count = cleaned[0]?.count || '';
        updated.supp = cleaned[0]?.supp || '';
        if (cleaned.length > 1) updated.items = cleaned;
        else delete updated.items;
        updated.result = modalState.result;
      } else if (k === 'weight') {
        const val = modalState.value.trim();
        if (!val || Number(val) <= 0) { showStatus('体重は0より大きい数値で入力してください。', 'danger'); return; }
        updated.value = val;
        updated.unconfirmed = modalState.unconfirmed;
        if (!updated.unconfirmed) updated.confirmedByUser = true;
      } else if (k === 'health') {
        updated.category = modalState.category || 'その他';
      } else if (k === 'breed') {
        updated.partner = modalState.partner;
        updated.child = modalState.child;
        const ids = [updated.pet, updated.partner, updated.child].filter(Boolean);
        if (new Set(ids).size !== ids.length) {
          showStatus('母・父・子には別々の個体を指定してください。', 'danger');
          return;
        }
        updated.unconfirmed = modalState.unconfirmed;
        if (!updated.unconfirmed) updated.confirmedByUser = true;
      }

      const nextRecords = isNew
        ? [...state.data.records, updated]
        : state.data.records.map(r => r.id === updated.id ? updated : r);
      persistData({ ...state.data, records: nextRecords }, isNew ? '記録を追加しました' : '記録を更新しました');
      closeModal();
      render();
    };
  }
  mountModal();
}

// ============================================================================
// 9. グローバルイベント委譲
// ============================================================================
document.addEventListener('click', (e) => {
  const navBtn = e.target.closest('[data-nav]');
  if (navBtn) {
    state.tab = navBtn.dataset.nav;
    state.selectedPetId = '';
    render();
    window.scrollTo(0, 0);
    return;
  }
  const openPet = e.target.closest('[data-open-pet]');
  if (openPet) {
    state.tab = '個体';
    state.selectedPetId = openPet.dataset.openPet;
    render();
    window.scrollTo(0, 0);
    return;
  }
  if (e.target.closest('[data-back-pets]')) {
    state.selectedPetId = '';
    render();
    return;
  }
  const editProf = e.target.closest('[data-edit-profile]');
  if (editProf) {
    openProfileModal(editProf.dataset.editProfile);
    return;
  }
  const newRec = e.target.closest('[data-new-rec]');
  if (newRec) {
    const kind = newRec.dataset.newRec;
    const pet = newRec.dataset.petId || state.recPetFilter || (kind === 'breed' ? '1' : '0');
    openRecordModal({ kind, date: state.recDateFilter || todayJST(), pet }, true);
    return;
  }
  const editRec = e.target.closest('[data-edit-rec]');
  if (editRec) {
    const rec = state.data.records.find(r => r.id === editRec.dataset.editRec);
    if (rec) openRecordModal(rec, false);
    return;
  }
  const confRec = e.target.closest('[data-confirm-record]');
  if (confRec) {
    const rec = state.data.records.find(r => r.id === confRec.dataset.confirmRecord);
    if (rec) {
      showConfirm('要確認データの確定', `${rec.date} の体重 ${rec.value} g を確定データとして体重グラフに反映しますか？`, () => {
        const next = {
          ...state.data,
          records: state.data.records.map(r => r.id === rec.id ? { ...r, unconfirmed: false, confirmedByUser: true } : r)
        };
        persistData(next, '体重データを確定しました');
        render();
      });
    }
    return;
  }
  const jumpDate = e.target.closest('[data-jump-date]');
  if (jumpDate) {
    state.tab = '日付別記録';
    state.recDateFilter = jumpDate.dataset.jumpDate;
    state.recKindFilter = 'feed';
    state.recPetFilter = '';
    render();
    window.scrollTo(0, 0);
    return;
  }
  const addFood = e.target.closest('[data-add-food-item]');
  if (addFood) {
    const d = ensureDraftForPet(addFood.dataset.addFoodItem);
    d.items.push({ food: '', count: '', supp: '', customFood: false });
    saveDraft();
    render();
    return;
  }
  const remFood = e.target.closest('[data-remove-food-item]');
  if (remFood) {
    const [pid, idx] = remFood.dataset.removeFoodItem.split(':');
    const d = ensureDraftForPet(pid);
    if (d.items.length > 1) {
      d.items.splice(Number(idx), 1);
      saveDraft();
      render();
    }
    return;
  }
});

// 給餌入力フォームのリアルタイムドラフト保存
document.addEventListener('input', (e) => {
  const field = e.target.dataset?.draftField;
  if (!field) return;
  const pid = e.target.dataset.pet;
  const d = ensureDraftForPet(pid);
  if (field === 'note') {
    d.note = e.target.value;
  } else if (field === 'foodCustom') {
    const idx = Number(e.target.dataset.idx || 0);
    if (!d.items[idx]) d.items[idx] = { food: '', count: '', supp: '', customFood: true };
    d.items[idx].food = e.target.value;
  } else if (field === 'count') {
    const idx = Number(e.target.dataset.idx || 0);
    if (!d.items[idx]) d.items[idx] = { food: '', count: '', supp: '', customFood: false };
    d.items[idx].count = e.target.value;
  }
  saveDraft();
});

document.addEventListener('change', (e) => {
  const field = e.target.dataset?.draftField;
  if (!field) return;
  const pid = e.target.dataset.pet;
  const d = ensureDraftForPet(pid);
  if (field === 'result') {
    d.result = e.target.value;
    saveDraft();
  } else if (field === 'foodSelect') {
    const idx = Number(e.target.dataset.idx || 0);
    if (!d.items[idx]) d.items[idx] = { food: '', count: '', supp: '', customFood: false };
    if (e.target.value === FOOD_OTHER_VALUE) {
      d.items[idx].customFood = true;
      if (FOOD_CANDIDATES.includes(d.items[idx].food)) d.items[idx].food = '';
    } else {
      d.items[idx].customFood = false;
      d.items[idx].food = e.target.value;
    }
    saveDraft();
    render();
  } else if (field === 'supp') {
    const idx = Number(e.target.dataset.idx || 0);
    if (!d.items[idx]) d.items[idx] = { food: '', count: '', supp: '', customFood: false };
    d.items[idx].supp = e.target.value;
    saveDraft();
  }
});

// ============================================================================
// 10. 起動シーケンス
// ============================================================================
loadSavedFbConfig();
loadDraft();
loadFromLocalStorage();
render();
initFirebaseIfConfigured(true);

})();
